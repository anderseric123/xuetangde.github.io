<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">资金炸弹异动雷达示意</title>
  <desc id="desc">资金炸弹用于从多个品种中发现盘中大额成交和资金异动。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7e8"/>
      <stop offset="1" stop-color="#efd8aa"/>
    </linearGradient>
  </defs>
  <rect width="720" height="360" rx="22" fill="url(#bg)"/>
  <text x="44" y="52" fill="#2d2119" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="26" font-weight="800">资金炸弹：先发现哪里突然活跃</text>
  <text x="44" y="84" fill="#7c6045" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="16">它不是预测方向，而是把盘中大额成交和资金异动更快推到你眼前。</text>
  <g transform="translate(76 116)" font-family="Arial, 'Noto Sans SC', sans-serif">
    <rect width="568" height="178" rx="16" fill="#fffdf8"/>
    <g fill="#7c6045" font-size="13" font-weight="800">
      <text x="28" y="34">时间</text>
      <text x="130" y="34">品种</text>
      <text x="260" y="34">异动强度</text>
      <text x="430" y="34">后续观察</text>
    </g>
    <g font-size="15" font-weight="850">
      <text x="28" y="72" fill="#49382b">10:15</text>
      <text x="130" y="72" fill="#49382b">螺纹钢</text>
      <rect x="260" y="56" width="164" height="18" rx="4" fill="#d98f56"/>
      <text x="444" y="72" fill="#b37a2a">连续放量</text>
      <text x="28" y="112" fill="#49382b">10:18</text>
      <text x="130" y="112" fill="#49382b">铁矿石</text>
      <rect x="260" y="96" width="120" height="18" rx="4" fill="#d8a856"/>
      <text x="444" y="112" fill="#b37a2a">板块联动</text>
      <text x="28" y="152" fill="#49382b">10:22</text>
      <text x="130" y="152" fill="#49382b">焦煤</text>
      <rect x="260" y="136" width="82" height="18" rx="4" fill="#6aa6c8"/>
      <text x="444" y="152" fill="#b37a2a">继续跟踪</text>
    </g>
  </g>
  <text x="78" y="326" fill="#6b5847" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" font-weight="800">核心：先定位异动对象和时间，再看价格、成交、持仓和订单流是否接住这次异动。</text>
</svg>
