<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">量价状态典型组合示意</title>
  <desc id="desc">同样是上涨或下跌，成交量和持仓量组合不同，观察含义也不同。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ea"/>
      <stop offset="1" stop-color="#f0ddb7"/>
    </linearGradient>
  </defs>
  <rect width="720" height="360" rx="22" fill="url(#bg)"/>
  <text x="44" y="52" fill="#2d2119" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="26" font-weight="800">同样价格变化，结构可能完全不同</text>
  <text x="44" y="84" fill="#7c6045" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="16">量价状态的重点，是看四个维度是否相互配合。</text>
  <g transform="translate(54 120)" font-family="Arial, 'Noto Sans SC', sans-serif">
    <rect width="612" height="176" rx="16" fill="#fffdf8"/>
    <g font-size="14" font-weight="850">
      <text x="26" y="36" fill="#7c6045">组合</text>
      <text x="150" y="36" fill="#7c6045">结构</text>
      <text x="394" y="36" fill="#7c6045">观察含义</text>
      <text x="26" y="74" fill="#49382b">上涨</text>
      <text x="150" y="74" fill="#49382b">放量 + 增仓 + 流入</text>
      <text x="394" y="74" fill="#b37a2a">活跃度提高</text>
      <text x="26" y="112" fill="#49382b">上涨</text>
      <text x="150" y="112" fill="#49382b">放量 + 减仓 + 流出</text>
      <text x="394" y="112" fill="#b37a2a">资金留存下降</text>
      <text x="26" y="150" fill="#49382b">震荡</text>
      <text x="150" y="150" fill="#49382b">放量 + 增仓 + 流入</text>
      <text x="394" y="150" fill="#b37a2a">区间交换活跃</text>
    </g>
    <path d="M22 52h568M22 90h568M22 128h568" stroke="#ead9bb" stroke-width="1"/>
  </g>
  <text x="78" y="326" fill="#6b5847" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" font-weight="800">不要把组合直接翻译成方向，先用中性语言描述盘面活跃度、资金留存和分歧状态。</text>
</svg>
