<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">量价状态时间线示意</title>
  <desc id="desc">量价状态时间线帮助观察状态是否连续、是否切换以及是否靠近重要事件。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7e8"/>
      <stop offset="1" stop-color="#efd8aa"/>
    </linearGradient>
  </defs>
  <rect width="720" height="360" rx="22" fill="url(#bg)"/>
  <text x="44" y="54" fill="#2d2119" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="26" font-weight="800">时间线：看状态如何连续变化</text>
  <text x="44" y="86" fill="#7c6045" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="16">只看当前一条状态不够，还要看它是一次性变化，还是连续性变化。</text>
  <g transform="translate(64 136)" font-family="Arial, 'Noto Sans SC', sans-serif">
    <line x1="42" y1="78" x2="548" y2="78" stroke="#d8a856" stroke-width="5" stroke-linecap="round"/>
    <g font-size="14" font-weight="850">
      <circle cx="60" cy="78" r="14" fill="#d98f56"/>
      <text x="28" y="34" fill="#49382b">10:05</text>
      <text x="0" y="120" fill="#7c6045">上涨+放量</text>
      <circle cx="236" cy="78" r="14" fill="#d98f56"/>
      <text x="204" y="34" fill="#49382b">10:10</text>
      <text x="176" y="120" fill="#7c6045">震荡+放量</text>
      <circle cx="412" cy="78" r="14" fill="#6aa6c8"/>
      <text x="380" y="34" fill="#49382b">10:15</text>
      <text x="352" y="120" fill="#7c6045">下跌+减仓</text>
      <circle cx="548" cy="78" r="14" fill="#b37a2a"/>
      <text x="516" y="34" fill="#49382b">事件后</text>
      <text x="498" y="120" fill="#7c6045">继续验证</text>
    </g>
  </g>
  <text x="76" y="326" fill="#6b5847" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" font-weight="800">时间线适合观察状态是否延续、是否切换，以及重要数据或消息附近盘面是否有反应。</text>
</svg>
