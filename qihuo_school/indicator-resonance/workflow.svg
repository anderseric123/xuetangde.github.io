<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">指标共振完整观察流程示意</title>
  <desc id="desc">指标共振出现后，依次看数量、类型、价格背景、资金炸弹、订单流、量价状态和后续反应。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7e8"/>
      <stop offset="1" stop-color="#efd8aa"/>
    </linearGradient>
  </defs>
  <rect width="720" height="360" rx="22" fill="url(#bg)"/>
  <text x="44" y="54" fill="#2d2119" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="26" font-weight="800">看到指标共振后，继续做七步验证</text>
  <text x="44" y="86" fill="#7c6045" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="16">把共振放进完整盘面框架，而不是把它当作孤立结论。</text>
  <g transform="translate(42 126)" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15" font-weight="850">
    <rect x="0" y="0" width="118" height="64" rx="14" fill="#fffdf8"/>
    <text x="22" y="39" fill="#2d2119">共振数量</text>
    <rect x="142" y="0" width="118" height="64" rx="14" fill="#fffdf8"/>
    <text x="164" y="39" fill="#2d2119">指标类型</text>
    <rect x="284" y="0" width="118" height="64" rx="14" fill="#fffdf8"/>
    <text x="306" y="39" fill="#2d2119">价格背景</text>
    <rect x="426" y="0" width="118" height="64" rx="14" fill="#fffdf8"/>
    <text x="448" y="39" fill="#2d2119">资金炸弹</text>
    <rect x="568" y="0" width="118" height="64" rx="14" fill="#fffdf8"/>
    <text x="598" y="39" fill="#2d2119">订单流</text>
    <path d="M122 32h16M264 32h16M406 32h16M548 32h16" stroke="#b37a2a" stroke-width="4" stroke-linecap="round"/>
    <path d="M626 76v46H334" stroke="#d8a856" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M334 122l12-8v16z" fill="#d8a856"/>
    <rect x="198" y="112" width="132" height="64" rx="14" fill="#fffdf8"/>
    <text x="226" y="151" fill="#2d2119">量价状态</text>
    <rect x="374" y="112" width="132" height="64" rx="14" fill="#fffdf8"/>
    <text x="402" y="151" fill="#2d2119">后续反应</text>
    <path d="M334 144h36" stroke="#b37a2a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="76" y="326" fill="#6b5847" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14" font-weight="800">目的：确认这次共振是短时波动，还是多维状态真的开始变活跃。</text>
</svg>
