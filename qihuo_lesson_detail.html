<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>期货学堂课程</title>
    <link href="//cdn.jin10.com/assets/img/commons/favicon.ico" type="image/x-icon" rel="icon" />
    <script src="https://cdn.jin10.com/plugins/jsBridge/index.js"></script>
    <link href="./css/test-env-tag.css" rel="stylesheet" />
    <script>
      function stat(sites) {
        const parsedSites = stat._parseSites(sites);
        if (parsedSites.indexOf("1000171913") > -1) {
          parsedSites.push("1253039837");
        }
        parsedSites.forEach((site) => {
          const script = stat._createScript(site);
          document.head.appendChild(script);
        });
      }

      stat._parseSites = function (sites = []) {
        sites = [].concat(sites);
        if (stat.commonIncluded) {
          sites.unshift("common");
        }
        const parse = (site) => stat.sites[site] || site;
        const unique = (arr) => {
          const newArr = [];
          for (let i = 0; i < arr.length; i++) {
            const item = arr[i];
            if (newArr.indexOf(item) === -1) {
              newArr.push(item);
            }
          }
          return newArr;
        };
        return unique(sites.map(parse));
      };

      stat._createScript = function (id) {
        const script = document.createElement("script");
        const protocol = location.protocol;
        const args = [];
        args.push(`id=${id}`);
        args.push(`web_id=${id}`);
        args.push("async=1");
        script.charset = "utf-8";
        script.type = "text/javascript";
        script.async = true;
        script.src = `${protocol}//s96.cnzz.com/z_stat.php?${args.join("&")}`;
        return script;
      };

      stat.commonIncluded = true;
      stat.sites = {
        common: "1000171913",
        vip: "1255889801",
        diary: "1262999091",
        hero: "1262999091",
        news: "1254618299",
        video: "1253231394",
        calendar: "1253656910",
        datacenter: "1261933372"
      };

      let cnzzStatInitialized = false;

      function initCnzzStat() {
        if (cnzzStatInitialized) return;
        cnzzStatInitialized = true;
        try {
          stat();
        } catch (error) {
          console.warn("cnzzStat 初始化失败", error);
        }
      }

      function initTestEnvTag() {
        const hostname = window.location.hostname;
        if (!hostname.startsWith("frontend-test.jin10.com") && !["localhost", "127.0.0.1", "local.jin10.com"].includes(hostname)) {
          return;
        }
        if (document.getElementById("test-env-tag")) return;

        const tag = document.createElement("div");
        tag.id = "test-env-tag";
        tag.innerHTML = [
          '<span class="mobile-text flex items-center justify-center">',
          '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 2 1.88 1.88"/><path d="M14.12 3.88 16 2"/><path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6 13H2"/><path d="M3 21c0-2.1 1.7-3.9 3.8-4"/><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/><path d="M22 13h-4"/><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/></svg>',
          "</span>",
          '<span class="pc-text">测试环境</span>'
        ].join("\n");
        document.body.appendChild(tag);
        tag.style.top = "70px";
        tag.style.left = "10px";
      }
    </script>
    <style>
      :root {
        --stage: #efe3cf;
        --paper: #fbf5ec;
        --surface: #fffaf3;
        --ink: #25150f;
        --muted: #8b7d6b;
        --line: rgba(37, 21, 15, 0.08);
        --gold: #d7a64d;
        --gold-dark: #a97727;
        --font-display: "Source Han Serif CN", "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif;
        --font-number: "D-DIN-PRO", "D-DIN", "DIN Pro", "DIN Alternate", Georgia, serif;
      }

      * { box-sizing: border-box; }

      html,
      body {
        min-height: 100%;
        overflow-x: hidden;
        background: #fff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #fff;
        color: var(--ink);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      a, button { -webkit-tap-highlight-color: transparent; }

      .page {
        width: min(414px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 18px 16px 96px;
        background: var(--paper);
      }

      .topbar {
        display: grid;
        grid-template-columns: 36px 1fr 36px;
        align-items: center;
        min-height: 44px;
        margin-bottom: 16px;
      }

      .back {
        display: inline-flex;
        width: 34px;
        height: 34px;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        font-size: 24px;
        line-height: 1;
        text-decoration: none;
        box-shadow: 0 10px 20px rgba(91, 63, 36, 0.08);
      }

      .brand {
        display: block;
        justify-content: center;
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
        line-height: 1.4;
        text-align: center;
      }

      .lesson-hero {
        padding: 12px 0 18px;
      }

      .lesson-kicker {
        display: block;
        margin: 0 0 10px;
        color: var(--gold-dark);
        font-size: 13px;
        font-weight: 800;
        line-height: 1.3;
      }

      h1 {
        margin: 0;
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 24px;
        font-weight: 900;
        line-height: 1.34;
        letter-spacing: 1px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 18px 0 0;
      }

      .meta span {
        display: inline-flex;
        min-height: 26px;
        align-items: center;
        padding: 5px 9px;
        border-radius: 4px;
        background: var(--surface);
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
        line-height: 1.35;
      }

      .article-visual {
        display: grid;
        grid-template-columns: 76px 1fr;
        gap: 14px;
        align-items: stretch;
        margin: 0 0 14px;
      }

      .article-visual img {
        display: block;
        width: 76px;
        height: 106px;
        object-fit: cover;
        box-shadow: 6px 10px 18px rgba(52, 37, 24, 0.12);
      }

      .insight-card {
        position: relative;
        display: flex;
        min-height: 106px;
        flex-direction: column;
        justify-content: center;
        overflow: hidden;
        padding: 18px 14px 14px 42px;
        border-radius: 8px;
        background: rgba(215, 166, 77, 0.12);
      }

      .insight-card::before {
        position: absolute;
        top: 10px;
        left: 12px;
        content: "“";
        color: rgba(179, 122, 42, 0.28);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 54px;
        font-weight: 700;
        line-height: 1;
      }

      .insight-card span {
        display: block;
        margin-bottom: 8px;
        color: var(--gold-dark);
        font-size: 12px;
        font-weight: 850;
      }

      .insight-card p {
        margin: 0;
        color: var(--ink);
        font-size: 14px;
        font-weight: 750;
        line-height: 1.65;
      }

      .insight-line {
        display: block;
        opacity: 0;
        transform: translateY(8px);
        animation: insightLineIn 0.52s ease forwards;
      }

      @keyframes insightLineIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .content {
        display: grid;
        gap: 14px;
      }

      .content-block {
        border-radius: 8px;
        background: rgba(255, 250, 243, 0.76);
        padding: 16px;
        box-shadow: 0 12px 28px rgba(91, 63, 36, 0.08);
      }

      .content-block h2 {
        margin: 0 0 10px;
        color: var(--ink);
        font-size: 17px;
        font-weight: 850;
        line-height: 1.35;
      }

      .content-block p {
        margin: 0 0 12px;
        color: #3d2d22;
        font-size: 15px;
        line-height: 1.82;
      }

      .content-block p:last-child { margin-bottom: 0; }

      .figure-grid {
        display: grid;
        gap: 12px;
      }

      .lesson-figure {
        margin: 0;
      }

      .content-block > .lesson-figure {
        margin: 14px 0 24px;
      }

      .lesson-figure img {
        display: block;
        width: 100%;
        min-height: 168px;
        border-radius: 6px;
        background: #fff7e8;
        object-fit: contain;
        box-shadow: inset 0 0 0 1px rgba(179, 122, 42, 0.12);
      }

      .lesson-figure figcaption {
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.55;
      }

      .lesson-video {
        display: grid;
        gap: 8px;
      }

      .lesson-video video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 6px;
        background: #211812;
        object-fit: cover;
        box-shadow: 0 10px 20px rgba(52, 37, 24, 0.12);
      }

      .lesson-video-title {
        color: var(--gold-dark);
        font-size: 14px;
        font-weight: 850;
        line-height: 1.45;
      }

      .lesson-video-caption {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.55;
      }

      mark {
        padding: 0;
        border-radius: 0;
        background: transparent;
        color: inherit;
        font-weight: 850;
      }

      .content-block ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .content-block li {
        position: relative;
        margin: 0 0 9px;
        padding-left: 16px;
        color: #49382b;
        font-size: 14px;
        line-height: 1.72;
      }

      .content-block li:last-child { margin-bottom: 0; }

      .content-block li::before {
        position: absolute;
        top: 10px;
        left: 0;
        width: 5px;
        height: 5px;
        content: "";
        border-radius: 50%;
        background: var(--gold);
      }

      .source-list a {
        color: var(--gold-dark);
        text-decoration: none;
      }

      .lesson-nav {
        position: fixed;
        right: auto;
        bottom: 0;
        left: 50%;
        z-index: 6;
        display: grid;
        width: min(414px, 100%);
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 10px 16px 14px;
        background: rgba(251, 245, 236, 0.94);
        box-shadow: 0 -8px 22px rgba(91, 63, 36, 0.06);
        transform: translateX(-50%);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
      }

      .lesson-nav a,
      .lesson-nav span {
        display: flex;
        min-height: 40px;
        justify-content: center;
        align-items: center;
        padding: 8px 10px;
        border: 0;
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        font-size: 13px;
        font-weight: 750;
        text-align: center;
        text-decoration: none;
        box-shadow: 0 4px 12px rgba(91, 63, 36, 0.06);
      }

      .lesson-nav small {
        display: none;
      }

      .lesson-nav .is-disabled {
        color: var(--muted);
        opacity: 0.55;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a class="back" href="qihuo_school.html" aria-label="返回">‹</a>
        <div class="brand" id="lesson-brand">期货学堂</div>
        <span></span>
      </header>

      <article id="lesson-root"></article>
    </main>

    <script src="qihuo_school_data.js"></script>
    <script>
      const courseData = window.QIHUO_SCHOOL_CONTENT || { categories: [], lessons: [], sourceMap: {} };
      const root = document.getElementById("lesson-root");
      const lessonBrand = document.getElementById("lesson-brand");
      const params = new URLSearchParams(location.search);
      const id = params.get("id") || courseData.lessons[0]?.id;
      const lesson = courseData.lessons.find((item) => item.id === id) || courseData.lessons[0];
      const category = courseData.categories.find((item) => item.lessons.includes(lesson?.id));
      const importantTerms = ["预期", "兑现", "结构", "资金", "持仓", "基差", "月差", "现货", "逻辑", "盘面", "库存", "风险", "验证"];

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#39;",
        })[char]);
      }

      function normalizeList(value) {
        const items = Array.isArray(value) ? value : value ? [value] : [];
        return items
          .flatMap((item) => String(item).split(/\s*\*\s*/))
          .map((item) => item.trim())
          .filter((item) => item && !/^-{3,}$/.test(item));
      }

      function toChineseNumber(value) {
        return ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"][value] || String(value);
      }

      function localLessonIndex() {
        if (!lesson || !category) return 1;
        const index = category.lessons.indexOf(lesson.id);
        return index >= 0 ? index + 1 : Number(lesson.id) || 1;
      }

      function coverSrc() {
        return category ? `covers/${category.title}.png` : "covers/通用方法.png";
      }

      function adjacentLesson(offset) {
        if (!lesson) return null;
        const currentIndex = courseData.lessons.findIndex((item) => item.id === lesson.id);
        return courseData.lessons[currentIndex + offset] || null;
      }

      function highlightHTML(value) {
        let html = escapeHTML(value);
        importantTerms.forEach((term) => {
          html = html.replaceAll(term, `<mark>${term}</mark>`);
        });
        return html;
      }

      function renderInsightLines(value) {
        const text = normalizeList(value)[0] || "";
        const parts = text.match(/.{1,18}(?:，|。|；|：|、|$)/g) || [text];
        return parts.map((part, index) => `<span class="insight-line" style="animation-delay:${(index * 0.16).toFixed(2)}s">${highlightHTML(part.trim())}</span>`).join("");
      }

      function renderInlineVideo(video) {
        if (!video || !video.src) return "";
        return `
          <div class="lesson-video" aria-label="${escapeHTML(video.title || "课程视频")}">
            ${video.title ? `<div class="lesson-video-title">${escapeHTML(video.title)}</div>` : ""}
            <video src="${escapeHTML(video.src)}" controls playsinline preload="metadata"></video>
            ${video.caption ? `<div class="lesson-video-caption">${escapeHTML(video.caption)}</div>` : ""}
          </div>
        `;
      }

      function renderInlineFigure(figure) {
        if (!figure || !figure.src) return "";
        return `
          <figure class="lesson-figure">
            <img src="${escapeHTML(figure.src || "")}" alt="${escapeHTML(figure.alt || figure.caption || "")}" loading="lazy" />
            ${figure.caption ? `<figcaption>${escapeHTML(figure.caption)}</figcaption>` : ""}
          </figure>
        `;
      }

      function renderParagraphs(items, inlineVideos, inlineFigures) {
        const videosByHeading = new Map((Array.isArray(inlineVideos) ? inlineVideos : []).map((video) => [video.afterHeading, video]));
        const figuresByKey = new Map((Array.isArray(inlineFigures) ? inlineFigures : []).map((figure) => [figure.key, figure]));
        return normalizeList(items).map((item) => {
          const figureMatch = item.match(/^\[\[figure:([a-z0-9-]+)\]\]$/i);
          if (figureMatch) {
            return renderInlineFigure(figuresByKey.get(figureMatch[1]));
          }
          let html = "";
          let heading = "";
          if (item.startsWith("## ")) {
            heading = item.slice(3);
            html = `<h2>${highlightHTML(heading)}</h2>`;
          } else if (item.startsWith("### ")) {
            heading = item.slice(4);
            html = `<h3>${highlightHTML(heading)}</h3>`;
          } else {
            html = `<p>${highlightHTML(item)}</p>`;
          }
          const video = heading ? videosByHeading.get(heading) : null;
          return `${html}${renderInlineVideo(video)}`;
        }).join("");
      }

      function renderListSection(title, items) {
        const normalized = normalizeList(items);
        if (!normalized.length) return "";
        return `
          <section class="content-block">
            <h2>${escapeHTML(title)}</h2>
            <ul>${normalized.map((item) => `<li>${highlightHTML(item)}</li>`).join("")}</ul>
          </section>
        `;
      }

      function renderFigures(figures) {
        if (!Array.isArray(figures) || !figures.length) return "";
        return `
          <section class="content-block figure-grid" aria-label="课程配图">
            ${figures.map((figure) => `
              <figure class="lesson-figure">
                <img src="${escapeHTML(figure.src || "")}" alt="${escapeHTML(figure.alt || figure.caption || "")}" loading="lazy" />
                ${figure.caption ? `<figcaption>${escapeHTML(figure.caption)}</figcaption>` : ""}
              </figure>
            `).join("")}
          </section>
        `;
      }

      function renderVideos(videos) {
        if (!Array.isArray(videos) || !videos.length) return "";
        return videos.map((video) => `
          <section class="content-block lesson-video" aria-label="${escapeHTML(video.title || "课程视频")}">
            ${video.title ? `<div class="lesson-video-title">${escapeHTML(video.title)}</div>` : ""}
            <video src="${escapeHTML(video.src || "")}" controls playsinline preload="metadata"></video>
            ${video.caption ? `<div class="lesson-video-caption">${escapeHTML(video.caption)}</div>` : ""}
          </section>
        `).join("");
      }

      function moduleId(categoryId) {
        return `module-${Number(categoryId)}`;
      }

      function renderNavButton(label, item) {
        if (!item) return `<span class="is-disabled">${label}<small>没有了</small></span>`;
        return `<a href="qihuo_lesson_detail.html?id=${encodeURIComponent(item.id)}">${label}<small>${escapeHTML(item.title)}</small></a>`;
      }

      function safeSet(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (error) {}
      }

      const chapterLabel = lesson && category ? `${category.title}-第${toChineseNumber(localLessonIndex())}章` : "期货学堂";
      lessonBrand.textContent = chapterLabel;

      root.innerHTML = lesson ? `
        <section class="lesson-hero">
          <span class="lesson-kicker">${escapeHTML(chapterLabel)}</span>
          <h1>${escapeHTML(lesson.title)}</h1>
          <div class="meta">
            ${lesson.audience ? `<span>${escapeHTML(lesson.audience)}</span>` : ""}
            ${lesson.question ? `<span>${escapeHTML(lesson.question)}</span>` : ""}
          </div>
        </section>
        <section class="article-visual" aria-label="课程重点">
          <img src="${coverSrc()}" alt="" />
          <div class="insight-card">
            <span>核心判断</span>
            <p>${renderInsightLines(normalizeList(lesson.summary)[0] || lesson.intro || lesson.title)}</p>
          </div>
        </section>
        ${renderVideos(lesson.videos)}
        <div class="content">
          <section class="content-block">
            ${lesson.intro ? `<p>${highlightHTML(lesson.intro)}</p>` : ""}
            ${renderParagraphs(lesson.body, lesson.inlineVideos, lesson.inlineFigures)}
          </section>
          ${renderFigures(lesson.figures)}
          ${renderListSection("常见误读", lesson.mistakes)}
          ${renderListSection("盘面确认信号", lesson.signals)}
          ${renderListSection("观察框架", lesson.framework)}
          ${renderListSection("案例提示", lesson.caseStudy)}
          ${renderListSection("小结", lesson.summary)}
        </div>
        <nav class="lesson-nav" aria-label="上下章节">
          ${renderNavButton("上一章", adjacentLesson(-1))}
          ${renderNavButton("下一章", adjacentLesson(1))}
        </nav>
      ` : `
        <section class="lesson-hero">
          <span class="chapter-number">--</span>
          <span class="category">期货学堂</span>
          <h1>没有找到这节课程</h1>
        </section>
      `;

      if (lesson && category) {
        safeSet("qihuo:lastModule", moduleId(category.id));
        safeSet("qihuo:lastLesson", lesson.id);
      }

      initCnzzStat();
      initTestEnvTag();
    </script>
  </body>
</html>
